# CPLDIcy I2C card -- AutoConfig identity and Copperline plugin manifest.
# See docs/board-facts.md sections 1-3 for the sourcing of every field
# below, and section 8 item 1 for the open manufacturer-ID question.

name = "CPLDIcy I2C"
zorro = 2
type = "wasm"
size = "64K"

# docs/board-facts.md flags a real discrepancy here: the CPLDIcy VHDL
# source (Logic/IcyCPLD.vhd) comments this as manufacturer 0x0A1C, but
# i2c.library's own driver source (bcu.i) and the independent Linux
# i2c-icy driver both hardcode manufacturer 5001 decimal (0x1389) /
# product 15. Shipping the i2c.library value here since the Phase 1 gate
# is "unmodified i2c.library finds the board" -- that behavioral test is
# the actual ground truth, not either research pass alone. Revisit if a
# real board or Henryk Richter's reply resolves the discrepancy.
manufacturer = 0x1389 # 5001 decimal
product = 15          # 0x0F

wasm = "../target/wasm32-unknown-unknown/release/cpldicy_plugin.wasm"
int2 = true

# Per-device enable/config (docs/PLAN.md section 3.7, docs/board-facts.md
# section 5-6 for which devices are the real board's own authentic
# residents vs. this project's teaching sample set). Defaults mirror
# plugin/src/board.rs's BoardConfig::default() -- see that struct's doc
# comment for the reasoning behind each default.
[config]
pcf8574 = "true"    # GPIO expander sample device; Phase 1's i2c.library gate depends on this
eeprom = "false"     # 24Cxx EEPROM sample device
eeprom_size = "4096" # bytes; 24C32-class
# eeprom_image = ""  # optional: type=file resource, initial EEPROM contents
lm75 = "false"       # simplest temperature-sensor sample device
ltc2990 = "true"     # the real board's own authentic monitor chip
pcf8583 = "false"    # RTC sample device
# pcf8583_time = ""  # optional: "YYYY-MM-DD HH:MM:SS", initial time (defaults to the epoch if unset)
ds1307 = "false"     # RTC sample device (fixed address 0x68, no address pins)
# ds1307_time = ""   # optional: "YYYY-MM-DD HH:MM:SS", initial time (defaults to the epoch if unset)
ds1629 = "false"     # RTC sample device (fixed address 0x4F, command-dispatch protocol)
# ds1629_time = ""   # optional: "YYYY-MM-DD HH:MM:SS", initial time (defaults to the epoch if unset)
r2025 = "false"      # RTC sample device (fixed address 0x32, no address pins)
# r2025_time = ""    # optional: "YYYY-MM-DD HH:MM:SS", initial time (defaults to the epoch if unset)
fan = "true"         # the real board's own authentic MAX31760 fan controller
# scenario = ""      # optional: type=file resource, deterministic event timeline (see plugin/src/scenario.rs)

[[option]]
key = "pcf8574"
label = "PCF8574 GPIO expander"
type = "bool"

[[option]]
key = "eeprom"
label = "24Cxx EEPROM"
type = "bool"

[[option]]
key = "eeprom_size"
label = "EEPROM size (bytes)"
type = "int"

[[option]]
key = "eeprom_image"
label = "EEPROM initial contents"
type = "file"

[[option]]
key = "lm75"
label = "LM75 temperature sensor"
type = "bool"

[[option]]
key = "ltc2990"
label = "LTC2990 voltage/temperature monitor"
type = "bool"

[[option]]
key = "pcf8583"
label = "PCF8583 clock/calendar"
type = "bool"

[[option]]
key = "pcf8583_time"
label = "PCF8583 initial time (YYYY-MM-DD HH:MM:SS)"
type = "string"

[[option]]
key = "ds1307"
label = "DS1307 clock/calendar"
type = "bool"

[[option]]
key = "ds1307_time"
label = "DS1307 initial time (YYYY-MM-DD HH:MM:SS)"
type = "string"

[[option]]
key = "ds1629"
label = "DS1629 clock/calendar"
type = "bool"

[[option]]
key = "ds1629_time"
label = "DS1629 initial time (YYYY-MM-DD HH:MM:SS)"
type = "string"

[[option]]
key = "r2025"
label = "R2025 clock/calendar"
type = "bool"

[[option]]
key = "r2025_time"
label = "R2025 initial time (YYYY-MM-DD HH:MM:SS)"
type = "string"

[[option]]
key = "fan"
label = "MAX31760 fan controller"
type = "bool"

[[option]]
key = "scenario"
label = "Scenario script"
type = "file"
