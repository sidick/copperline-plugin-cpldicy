# Copperline machine profile for the guest-oracle conformance pass
# (docs/PLAN.md section 4 tier 3): boots real i2c.library + FannyCtl +
# simplesensors against manifest/cpldicy.toml, with a host directory
# mounted live so unmodified Shell redirection can capture their output
# for the host to read back after the run.

[cpu]
model = "68000"

[memory]
chip = "512K"
slow = "512K"
fast = "2M"

[floppy]
drives = 1
speed = 0

[floppy.df0]
path = "oracle-boot.adf"
write_protected = true

[[zorro]]
metadata = "../../manifest/cpldicy.toml"

[[filesys]]
path = "oracle-out"
volume = "ORACLEOUT"

[emulation]
power_on = true
warp_speed = "max"
