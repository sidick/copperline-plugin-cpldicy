# Copperline machine profile for the guest-oracle conformance pass
# (docs/PLAN.md section 4 tier 3): boots real i2c.library + FannyCtl +
# simplesensors + I2Clock against manifest/cpldicy.toml, with a host
# directory mounted live so unmodified Shell redirection can capture
# their output for the host to read back after the run.
#
# DS1307/DS1629/R2025/LM75/BMP280/BME680/AM2320 are enabled here (off by
# default in the manifest itself) so I2Clock's SCAN/SAVE/SHOW and
# simplesensors have something real to exercise -- see README.md's
# Oracle compatibility section for what that validates.
#
# PCF8583 is deliberately NOT enabled here, even though it's also
# I2Clock-oracle-testable in isolation: its default address (0x50) is
# the same address this board's own authentic MAX31760 fan controller
# uses (`fan`, on by default) -- a real conflict a real board would have
# too (you can't populate both a MAX31760 and a PCF8583-at-A0 on the
# same bus), not an artifact of this being a software emulation. With
# both enabled, `I2cBusEngine::attach`'s address lookup silently
# resolves to whichever device was attached first (`board.rs`'s
# construction order), so FannyCtl/simplesensors would silently read
# PCF8583's registers instead of the real MAX31760 -- confirmed the hard
# way while validating BMP280/BME680/AM2320 (their addition made this
# machine config enable pcf8583 alongside fan for the first time, and
# FannyCtl's output turned out to be byte-identical whether fan was
# enabled or not, which is what gave the collision away).

[cpu]
model = "68000"

[memory]
chip = "512K"
slow = "512K"
fast = "2M"

[floppy]
drives = 1
speed = 0

[floppy.df0]
path = "oracle-boot.adf"
write_protected = true

[[zorro]]
metadata = "../../manifest/cpldicy.toml"
config = { ds1307 = "true", ds1629 = "true", r2025 = "true", lm75 = "true", bmp280 = "true", bme680 = "true", am2320 = "true" }

[[filesys]]
path = "oracle-out"
volume = "ORACLEOUT"

[emulation]
power_on = true
warp_speed = "max"
