name: Release

# Builds the release wasm32 plugin and publishes a downloadable bundle
# whenever a version tag is pushed (see PLAN.md section 5 Phase 3 item
# 3: "the .wasm + manifest/ + docs, relative paths intact -- that IS
# the packaging; no install step exists"). The bundle mirrors the
# repo's own directory layout exactly, so manifest/cpldicy.toml's
# relative `wasm = "../target/wasm32-unknown-unknown/release/..."` path
# resolves unchanged inside it -- someone who just wants the board
# (Copperline's GUI "Add board..." file picker, or a [[zorro]] config
# entry) never needs to touch cargo/rustup at all; someone who wants to
# read or extend it still gets the full source in the same clone/tag.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32 target
        run: rustup target add wasm32-unknown-unknown

      - name: Cache cargo registry/build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # Same gate as `make test` -- a broken tag should never become a
      # published release.
      - name: Run native unit + integration tests
        run: cargo test --locked

      - name: Build the release wasm32 plugin
        run: cargo build --release --locked --target wasm32-unknown-unknown

      - name: Assemble the release bundle
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          BUNDLE="cpldicy-plugin-${VERSION}"
          mkdir -p "$BUNDLE/manifest" "$BUNDLE/target/wasm32-unknown-unknown/release" "$BUNDLE/docs"

          cp manifest/cpldicy.toml "$BUNDLE/manifest/"
          cp target/wasm32-unknown-unknown/release/cpldicy_plugin.wasm \
             "$BUNDLE/target/wasm32-unknown-unknown/release/"
          cp docs/*.md "$BUNDLE/docs/"
          cp README.md PLAN.md "$BUNDLE/"

          zip -r "${BUNDLE}.zip" "$BUNDLE"
          echo "BUNDLE_ZIP=${BUNDLE}.zip" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.BUNDLE_ZIP }}
          generate_release_notes: true
