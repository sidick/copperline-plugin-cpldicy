# Devs:Sensors/*.cfg for i2csensors.library/simplesensors -- for the
# LM75 sample device this board can enable (the "lm75" manifest config
# key, plugin/src/devices/lm75.rs). NOTE: this parser (config.c) ends
# the current section on a closing square bracket even inside a '#'
# comment line, so this file avoids square brackets anywhere but the
# LM75 header two lines below -- confirmed the hard way, by hitting
# exactly that with an earlier draft of this very comment.
#
# Not from Henryk Richter's i2csensors repo (unlike LTC2990.cfg/
# MAX31760_*.cfg, which are official upstream files) -- no LM75.cfg
# exists there, so this one's authored for this project directly,
# following the same format documented in that repo's DS3231.cfg/
# MCP9808.cfg (TYPE arguments: TEMP,VOLTAGE,CURRENT,FAN,PRESSURE).
# Verified against this board's own emulated LM75 by running it through
# a real Copperline + i2csensors.library/simplesensors (tests/copperline/
# run-oracle.sh): with the device's 25.0C default, simplesensors reports
# "LM75 Temperature 25.0000 C".
[LM75]
I2CADDRESS = $90
# no control register bits set: continuous conversion, comparator mode,
# active-low O.S., no fault queueing -- this emulation never triggers
# the O.S. pin anyway (plugin/src/devices/lm75.rs's module docs)
INIT       = 00

# Temperature register: 9-bit two's complement, 0.5C/LSB, left-justified
# into a 16-bit big-endian word (top 9 bits carry the value, bottom 7
# bits always 0) -- LM75 datasheet, and this board's lm75.rs module docs.
# BITOFFSET/SIGNBIT count from the *start* of the read buffer (byte 0's
# MSB = bit 0), not from its LSB end -- confirmed against
# i2cclass_sensor.c's bit-extraction code, not just by pattern-matching
# the DS3231.cfg/MCP9808.cfg examples (whose own BITOFFSET/SIGNBIT
# values didn't make that convention obvious at a glance).
TYPE       = TEMP
READPRE    = 00
READBYTES  = 2
UNIT       = °C
MUL        = 0.5
BITOFFSET  = 0
NUMBITS    = 9
SIGNBIT    = 0
